[project]
name = "ai-portfolio-watchtower"
version = "0.1.0"
description = "Monitor AI portfolio accounts on X, extract portfolio events, store them, and send Slack alerts."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "supabase>=2.7.0",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.6.0",
]

[project.scripts]
watchtower = "ai_portfolio_watchtower.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

